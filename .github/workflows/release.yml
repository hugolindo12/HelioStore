# Gera o instalador do Windows e publica no Release quando você cria uma tag (ex.: v2.1.0).
# Antes: aumente "version" no package.json para o mesmo número da tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir se a versão do package.json é a da tag
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "package.json está na v$V, mas a tag é ${GITHUB_REF_NAME}"; exit 1; fi
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HelioStore-Setup-*.exe
          generate_release_notes: true

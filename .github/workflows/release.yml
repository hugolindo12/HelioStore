# Gera o instalador do Windows e publica no Release quando você cria uma tag (ex.: v2.1.0).
# Antes: aumente "version" no package.json para o mesmo número da tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir se a versão do package.json é a da tag
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "package.json está na v$V, mas a tag é ${GITHUB_REF_NAME}"; exit 1; fi
      - name: Gerar o instalador (assina se houver certificado nos Secrets)
        run: npx electron-builder --win --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Conferir a assinatura
        shell: pwsh
        run: |
          $f = Get-ChildItem dist/HelioStore-Setup-*.exe | Select-Object -First 1
          $s = Get-AuthenticodeSignature $f.FullName
          if ($s.Status -eq 'Valid') { Write-Host "Instalador assinado por: $($s.SignerCertificate.Subject)" }
          elseif ($env:CSC_LINK) { Write-Error "Havia certificado, mas a assinatura não é válida: $($s.Status)"; exit 1 }
          else { Write-Host "Instalador SEM assinatura (sem certificado nos Secrets). Veja SIGNING.md." }
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HelioStore-Setup-*.exe
          generate_release_notes: true

# Confere a sintaxe do código a cada push e Pull Request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          for f in main.js preload.js github.js src/app.js src/i18n.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('catalog/apps.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8'))"
